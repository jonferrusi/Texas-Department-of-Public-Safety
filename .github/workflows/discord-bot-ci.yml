name: Discord Bot CI

on:
  push:
    paths:
      - "discord-bot/**"
      - ".github/workflows/discord-bot-ci.yml"
  pull_request:
    paths:
      - "discord-bot/**"
      - ".github/workflows/discord-bot-ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: discord-bot
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
